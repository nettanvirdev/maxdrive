<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C8DF6"/>
      <stop offset="55%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0B57D0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- A stack of platters: several drives presented as one volume.
       Ellipses (rather than bars) keep it reading as storage at 16px. -->
  <g fill="#FFFFFF">
    <path d="M138 344a118 40 0 0 0 236 0v34a118 40 0 0 1-236 0z" opacity="0.55"/>
    <ellipse cx="256" cy="344" rx="118" ry="40" opacity="0.62"/>

    <path d="M138 256a118 40 0 0 0 236 0v34a118 40 0 0 1-236 0z" opacity="0.72"/>
    <ellipse cx="256" cy="256" rx="118" ry="40" opacity="0.80"/>

    <path d="M138 168a118 40 0 0 0 236 0v34a118 40 0 0 1-236 0z" opacity="0.88"/>
    <ellipse cx="256" cy="168" rx="118" ry="40" opacity="0.97"/>
  </g>
</svg>
